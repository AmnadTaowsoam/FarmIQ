name: farmiq-edge

networks:
  farm_edge:
    external: true
    name: farmiq-edge_farm_edge

services:
  # sensor-service
  sensor-service:
    build:
      context: ./services/sensor-service
      dockerfile: Dockerfile
    container_name: sensor-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=edge_sensor"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: edge_sensor
      ENV_PATH: /app/.env
      WRITE_DB: "true"
      MQTT_BROKER_URL: mqtt://edge-mqtt:1883
      SENSOR_RAW_SUB: "sensor.raw/+/+/+"
      DM_HEALTH_SUB: "dm/+/+/health"
      DM_LWT_SUB: "dm/+/+/lwt"
    networks: [farm_edge]
    healthcheck:
      test: ["CMD", "node", "-e", "http=require('http');http.get('http://localhost:6300/sensor/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    expose:
      - "6300"

  # edge-orchestrator
  edge-orchestrator:
    build:
      context: ./services/edge-orchestrator-service
      dockerfile: Dockerfile
    container_name: edge-orchestrator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=edge_orchestrator"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: edge_orchestrator
      MQTT_BROKER_URL: mqtt://edge-mqtt:1883
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: false
    networks: [farm_edge]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6301/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    expose:
      - "6301"

  # sync-service
  sync-service:
    build:
      context: ./services/sync-service
      dockerfile: Dockerfile
    container_name: sync-service
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ENV_PATH: /app/.env
      SYNC_PORT: ${SYNC_PORT:-6302}
      CLOUD_API_URL: http://host.docker.internal:7302/api
      CLOUD_API_KEY: ${CLOUD_API_KEY:-admin-key}
      SYNC_ENABLED: false
      DISABLE_SYNC: true
    env_file:
      - .env
    networks: [farm_edge]
    healthcheck:
      test: ["CMD", "node", "-e", "http=require('http');http.get('http://localhost:'+ (process.env.SYNC_PORT||'6302') +'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    init: true
    expose:
      - "6302"

  # weight-associator-service
  weight-associator:
    build:
      context: ./services/weight-associator-service
      dockerfile: Dockerfile
    container_name: weight-associator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=edge_weight"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: edge_weight
      ENV_PATH: /app/.env
      MQTT_BROKER_URL: mqtt://edge-mqtt:1883
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      API_KEY: ${API_KEY:-admin-key}
    networks: [farm_edge]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6303/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    expose:
      - "6303"

  # image-ingestion-service
  image-ingestion:
    build:
      context: ./services/images-ingestion-service
      dockerfile: Dockerfile
    container_name: image-ingestion
    restart: unless-stopped
    ports:
      - "${IMAGE_INGESTION_SERVICE_PORT:-6304}:6304"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=edge_image"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: edge_image
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: false
      ENV_PATH: /app/.env
      MQTT_BROKER_URL: mqtt://edge-mqtt:1883
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      API_KEY: ${API_KEY:-admin-key}
    networks: [farm_edge]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6304/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    expose:
      - "6304"

  # vision-inference-service (Python-based AI service for weight prediction)
  vision-inference:
    build:
      context: ./services/vision-inference-service
      dockerfile: Dockerfile
    container_name: vision-inference
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MQTT_BROKER_URL: mqtt://edge-mqtt:1883
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MODEL_PATH: /app/models
      DEFAULT_MODEL_VERSION: v1.0.0
      MAX_CONCURRENT_JOBS: 5
      VISION_MODEL_PATH: /app/models
      LOG_LEVEL: INFO
      ENVIRONMENT: development
    networks: [farm_edge]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6306/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    expose:
      - "6306"
    volumes:
      - ./services/vision-inference-service/models:/app/models:ro

  # edge-topic-bridge (translate sensor.* / dm/* to edge/* and optional Kafka)
  edge-topic-bridge:
    build:
      context: ./services/edge-topic-bridge
      dockerfile: Dockerfile
    container_name: edge-topic-bridge
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-mqtt://edge-mqtt:1883}
      TOPIC_PREFIX: edge
      ENABLE_KAFKA: ${ENABLE_KAFKA:-false}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
    networks: [farm_edge]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6305/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    expose:
      - "6305"
